<!doctype html>
<html lang="fa" dir="rtl">
<head>

<title>منوی کافه سایه</title>
<meta name="description" content="منوی دیجیتال کافه سایه با قیمت‌های به‌روز به تومان">
<meta name="theme-color" content="#120e0b">
<link rel="preload" href="fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23c8a26a'/><text x='50' y='68' font-size='52' text-anchor='middle'>☕</text></svg>">
</head>
<body>
<header class="m-hdr">

    <span class="status" data-status><i></i>…</span>
  </div>
  <nav class="chips" id="chips" aria-label="دسته‌بندی منو"></nav>

<main class="wrap" style="padding-bottom:40px">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>

  <div id="menu"></div>
  <p class="empty" id="empty" hidden>موردی پیدا نشد ☕</p>
</main>

<footer class="ftr">
  <div class="wrap">
    <p>قیمت‌ها به تومان است · <a href="index.html" style="color:var(--gold)">درباره‌ی کافه و آدرس</a></p>
  </div>
</footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <button class="x" id="sheetX" aria-label="بستن">×</button>
  <img id="sheetImg" alt="" width="400" height="300">
  <div class="b"><h3 id="sheetTitle"></h3><p id="sheetDesc"></p><div class="price" id="sheetPrice"></div></div>
</div>
<div class="sheet-bg" id="sheetBg"></div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
