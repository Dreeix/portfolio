<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوتیک یاس | فروشگاه آنلاین لباس</title>
<meta name="description" content="تی‌شرت، هودی، مانتو، شلوار و اکسسوری در رنگ‌های ملایم. خرید آنلاین با ارسال به سراسر ایران.">
<meta name="theme-color" content="#fff6fa">
<link rel="preload" href="fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23ffd6e6'/><circle cx='50' cy='50' r='22' fill='%237c5ce0'/></svg>">
</head>
<body>
<header class="hdr">
  <div class="wrap">
    <a href="#top" class="logo"><i></i><span id="logoName"></span></a>
    <button class="cart-btn" id="cartBtn" aria-label="سبد خرید">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <b id="cartCount" hidden></b>
    </button>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <div class="wrap">
      <div class="hero-card">
        <img src="img/hero.svg" alt="" width="600" height="420" fetchpriority="high">
        <div class="hero-txt">
          <span class="pill" id="freeShipPill"></span>
          <h1>رنگ‌های نرم<br>برای <span class="hl">روزهای خوب</span></h1>
          <p id="tagline"></p>
          <a href="#shop" class="btn btn-main">دیدن محصولات</a>
        </div>
      </div>
      <ul class="perks" id="perks"></ul>
    </div>
  </section>

  <section class="shop" id="shop">
    <div class="wrap">
      <div class="shop-head">
        <h2>محصولات</h2>
        <select id="sort" aria-label="مرتب‌سازی">
          <option value="new">جدیدترین</option>
          <option value="cheap">ارزان‌ترین</option>
          <option value="exp">گران‌ترین</option>
          <option value="off">بیشترین تخفیف</option>
        </select>
      </div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="جستجو: هودی، صورتی، کتان…" aria-label="جستجوی محصول"></label>
      <div class="chips" id="chips" role="tablist"></div>
      <p class="empty" id="empty" hidden>محصولی پیدا نشد. فیلتر یا جستجو را تغییر دهید.</p>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<footer class="ftr">
  <div class="wrap">
    <div class="soc"><a data-contact="instagram">اینستاگرام</a><a data-contact="telegram">تلگرام</a><a data-contact="whatsapp">واتساپ</a></div>
    <p id="copy"></p>
    <p class="demo-note">نسخه‌ی نمایشی: پرداخت و ارسال واقعی انجام نمی‌شود.</p>
  </div>
</footer>

<div class="sticky" id="sticky"><button class="btn btn-main" id="stickyBtn"></button></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="پنجره">
  <button class="x" id="sheetX" aria-label="بستن">×</button>
  <div id="sheetBody"></div>
</div>
<div class="sheet-bg" id="sheetBg"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
