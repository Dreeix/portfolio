<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوتیک یاس | فروشگاه آنلاین لباس</title>
<meta name="description" content="تی‌شرت، هودی، مانتو، شلوار و اکسسوری در رنگ‌های ملایم. خرید آنلاین با ارسال به سراسر ایران.">
<meta name="theme-color" content="#fff6fa">
<link rel="preload" href="fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<style data-src="css/style.css" data-hash="1a77enz">
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#fff6fa;--card:#fff;--ink:#3b2f4a;--muted:#8a7f96;--line:#f0e3ec;--main:#7c5ce0;--main2:#6a4bd1;--pink:#ffd6e6;--lilac:#ece6ff;--mint:#dff6ee;--peach:#ffecdc;--sale:#e0457b;--r:22px;--max:1140px;--pad:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--main);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.muted{color:var(--muted)}
.hl{color:var(--main)}
small{font-size:.78em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--main);color:#fff;box-shadow:0 8px 24px rgba(124,92,224,.28)}
.btn-main:hover{background:var(--main2)}
.btn.wide{width:100%;margin-top:14px}
.btn small{font-weight:600;opacity:.85}
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,246,250,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--pink),var(--lilac),var(--mint),var(--peach),var(--pink));box-shadow:inset 0 0 0 5px #fff6}
.cart-btn{position:relative;width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(59,47,74,.08)}
.cart-btn svg{width:22px;height:22px}
.cart-btn b{position:absolute;top:-4px;left:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--sale);color:#fff;font-size:12px;line-height:20px;text-align:center}
.hero{padding:16px 0 8px}
.hero-card{position:relative;border-radius:28px;overflow:hidden;background:var(--lilac)}
.hero-card img{width:100%;height:220px;object-fit:cover}
.hero-txt{padding:18px 20px 24px;background:linear-gradient(#fff0,#fff 0)}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--mint);color:#24745a;font-size:13px;font-weight:700;margin-bottom:8px}
.hero h1{font-size:clamp(30px,9vw,52px);font-weight:900;line-height:1.25;letter-spacing:-.5px}
.hero p{color:var(--muted);margin:8px 0 16px}
.perks{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.perks li{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;font-size:12px;font-weight:700;line-height:1.5}
.perks span{display:block;font-size:20px}
.shop{padding:24px 0 110px}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.shop-head h2{font-size:24px;font-weight:900}
select{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;height:40px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:12px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:none;height:46px;width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--pad)) 16px;padding:2px var(--pad)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:40px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}
.chips small{color:var(--muted)}
.chips [aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips [aria-selected=true] small{color:#fff9}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 18px rgba(59,47,74,.06);display:flex;flex-direction:column}
.card-img{position:relative;display:block;width:100%}
.card-img img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .3s}
.card:hover .card-img img{transform:scale(1.04)}
.tag{position:absolute;top:10px;right:10px;background:#fff;color:var(--main);font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px}
.tag.off{background:var(--sale);color:#fff}
.card-txt{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:14px;font-weight:700;line-height:1.5}
.card h3 button{text-align:right;min-height:32px;width:100%}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(59,47,74,.15)}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-top:auto}
.price b{font-weight:900;font-size:15px}
.price s{color:var(--muted);font-size:12px}
.price small{font-weight:600;color:var(--muted)}
.ftr{background:#fff;padding:28px 0 100px;text-align:center;font-size:13px;color:var(--muted)}
.soc{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.soc a{padding:8px 16px;border-radius:12px;background:var(--lilac);color:var(--ink);font-weight:700}
.demo-note{margin-top:4px;font-size:12px}
.sticky{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;max-width:520px;margin:0 auto;transform:translateY(150%);transition:transform .3s}
.sticky.on{transform:none}
.sticky .btn{width:100%}
.sheet-bg{position:fixed;inset:0;background:rgba(59,47,74,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--bg);border-radius:28px 28px 0 0;max-width:560px;max-height:92svh;overflow-y:auto;margin:0 auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .x{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:50%;background:#fff;font-size:24px;line-height:1;z-index:2}
.sheet h3{font-size:20px;font-weight:900;line-height:1.5;padding-left:44px}
.sheet h4{font-size:14px;margin:16px 0 8px}
.pd{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.pd img{border-radius:18px;width:120px;aspect-ratio:4/5;object-fit:cover}
.pd h3{padding:0;font-size:18px}
.pd p{font-size:14px;margin-top:6px}
.price.big b{font-size:18px}
.price.big .tag{position:static}
.swatches{display:flex;gap:10px}
.swatches button{width:40px;height:40px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(59,47,74,.15);outline-offset:3px}
.swatches [aria-pressed=true]{outline:2px solid var(--main)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes button{min-width:52px;height:44px;padding:0 12px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:800}
.sizes [aria-pressed=true]{border-color:var(--main);background:var(--lilac);color:var(--main2)}
.sizes button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.guide{margin-top:12px;font-size:13px}
.guide summary{cursor:pointer;color:var(--main);font-weight:700;min-height:32px}
.guide table{width:100%;border-collapse:collapse;margin-top:6px;background:#fff;border-radius:12px;overflow:hidden}
.guide td,.guide th{padding:6px;text-align:center;border-bottom:1px solid var(--line)}
.err{color:var(--sale);font-size:13px;font-weight:700;min-height:20px;margin-top:8px}
.cart-empty{text-align:center;padding:30px 0}
.cart-empty span{font-size:48px}
.cart-empty p{color:var(--muted);margin-bottom:16px}
.ship-bar{background:#fff;border-radius:16px;padding:10px 14px;margin:12px 0;font-size:13px;font-weight:700}
.ship-bar i{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:6px;position:relative;overflow:hidden}
.ship-bar i::after{content:"";position:absolute;inset:0;transform-origin:right;transform:scaleX(var(--k));background:linear-gradient(90deg,var(--main),#ff9cc2)}
.ship-bar.ok{background:var(--mint);color:#24745a}
.lines{list-style:none;display:grid;gap:10px}
.lines li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:8px}
.lines img{border-radius:12px}
.lines b{display:block;font-size:14px;line-height:1.5}
.lines span{display:block;font-size:12px}
.lines .price{font-size:14px;font-weight:800}
.qty{display:flex;flex-direction:column;align-items:center;gap:2px}
.qty button{width:34px;height:34px;border-radius:10px;background:var(--lilac);font-weight:900;font-size:16px}
.qty button:disabled{opacity:.35}
.qty output{font-weight:800;font-size:14px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:14px;font-size:14px}
.sum dd{font-weight:800;text-align:left}
.sum .save{color:var(--sale)}
.sum .tot{font-size:16px;font-weight:900;border-top:1px dashed var(--line);padding-top:8px}
.f{display:block;margin-top:12px}
.f span{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.f input,.f textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--main);outline:0}
.f em,.ship em{display:block;font-style:normal;color:var(--sale);font-size:12px;font-weight:700;min-height:0}
.ship{border:0;margin-top:14px}
.ship legend{font-size:13px;font-weight:700;margin-bottom:6px}
.ship label{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ship label:has(:checked){border-color:var(--main);background:var(--lilac)}
.ship input{width:18px;height:18px;accent-color:var(--main)}
.ship span{flex:1;display:flex;flex-direction:column;line-height:1.5}
.ship span small{color:var(--muted)}
.ship i{font-style:normal;font-weight:800;font-size:13px}
.demo-pay{background:var(--peach);border-radius:14px;padding:10px 12px;font-size:12px;margin-top:14px;font-weight:600}
.done{text-align:center}
.done .ok{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--mint);color:#24745a;font-size:32px;font-weight:900;margin-bottom:6px}
.done h3{padding:0}
.done ul{list-style:none;background:#fff;border-radius:16px;padding:10px 14px;margin-top:12px;text-align:right;font-size:14px}
.done .sum{text-align:right}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-30px);z-index:100;background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;width:max-content;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .hero-card{display:grid;grid-template-columns:1fr 1fr;align-items:center}
  .hero-card img{height:100%;min-height:340px;order:2}
  .hero-txt{padding:40px}
  .perks{font-size:14px}
}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr);gap:20px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23ffd6e6'/><circle cx='50' cy='50' r='22' fill='%237c5ce0'/></svg>">
</head>
<body>
<header class="hdr">
  <div class="wrap">
    <a href="#top" class="logo"><i></i><span id="logoName"></span></a>
    <button class="cart-btn" id="cartBtn" aria-label="سبد خرید">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <b id="cartCount" hidden></b>
    </button>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <div class="wrap">
      <div class="hero-card">
        <img src="img/hero.svg" alt="" width="600" height="420" fetchpriority="high">
        <div class="hero-txt">
          <span class="pill" id="freeShipPill"></span>
          <h1>رنگ‌های نرم<br>برای <span class="hl">روزهای خوب</span></h1>
          <p id="tagline"></p>
          <a href="#shop" class="btn btn-main">دیدن محصولات</a>
        </div>
      </div>
      <ul class="perks" id="perks"></ul>
    </div>
  </section>

  <section class="shop" id="shop">
    <div class="wrap">
      <div class="shop-head">
        <h2>محصولات</h2>
        <select id="sort" aria-label="مرتب‌سازی">
          <option value="new">جدیدترین</option>
          <option value="cheap">ارزان‌ترین</option>
          <option value="exp">گران‌ترین</option>
          <option value="off">بیشترین تخفیف</option>
        </select>
      </div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="جستجو: هودی، صورتی، کتان…" aria-label="جستجوی محصول"></label>
      <div class="chips" id="chips" role="tablist"></div>
      <p class="empty" id="empty" hidden>محصولی پیدا نشد. فیلتر یا جستجو را تغییر دهید.</p>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<footer class="ftr">
  <div class="wrap">
    <div class="soc"><a data-contact="instagram">اینستاگرام</a><a data-contact="telegram">تلگرام</a><a data-contact="whatsapp">واتساپ</a></div>
    <p id="copy"></p>
    <p class="demo-note">نسخه‌ی نمایشی: پرداخت و ارسال واقعی انجام نمی‌شود.</p>
  </div>
</footer>

<div class="sticky" id="sticky"><button class="btn btn-main" id="stickyBtn"></button></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="پنجره">
  <button class="x" id="sheetX" aria-label="بستن">×</button>
  <div id="sheetBody"></div>
</div>
<div class="sheet-bg" id="sheetBg"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
