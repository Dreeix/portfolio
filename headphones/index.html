<!-- All CSS is inline (no extra round trip before first paint: ~2 s saved on slow 3G). Edit it here. -->
<style>
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#08090b;--bg2:#101217;--card:#14161c;--line:#262a33;--text:#f5f6f8;--muted:#9aa1ad;--acc:#6d7cff;--max:1180px;--pad:20px;--hdr:60px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
/* Vazirmatn is only requested once html.f is set (poster loaded): on slow 3G the 12 KB poster (LCP) no longer shares bandwidth with the 109 KB font */
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
html.f body{font-family:Vazirmatn,Tahoma,sans-serif}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad);width:100%}
.center{text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 28px;border-radius:999px;font-weight:800;font-size:16px;background:var(--text);color:#08090b;transition:transform .15s,box-shadow .3s,background .3s;white-space:nowrap;box-shadow:0 10px 40px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn-line{background:transparent;color:var(--text);border:1.5px solid #ffffff40;box-shadow:none}
.btn-sm{min-height:36px;padding:6px 18px;font-size:14px}
.eyebrow{display:inline-block;font-size:14px;font-weight:800;color:var(--acc);margin-bottom:6px;transition:color .6s}

/* Header */
.hdr{position:fixed;inset:0 0 auto;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.hdr.solid{background:rgba(8,9,11,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:var(--hdr)}
.logo{font-weight:900;font-size:22px;letter-spacing:-.3px;min-height:40px;display:flex;align-items:center}
.nav{display:none;gap:28px;color:var(--muted);font-size:15px}
.nav a{padding:8px 0}.nav a:hover{color:var(--text)}

/* Story: sticky 3D stage behind full-screen scenes */
.story{position:relative;background:radial-gradient(120% 70% at 50% 30%,#171a22 0,var(--bg) 70%)}
.stage{position:sticky;top:0;height:100vh;height:100svh;margin-bottom:-100vh;margin-bottom:-100svh;overflow:hidden;pointer-events:none;z-index:0;
  --px:0;--py:.36;--s:.72;--size:calc(var(--s) * min(100svh, 133.33vw))}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;opacity:0;transition:opacity .8s}
.stage.live canvas{opacity:1}
.poster{position:absolute;width:var(--size);height:var(--size);max-width:none;left:calc(50% + var(--px) * 50% - var(--size) / 2);top:calc(50% - var(--py) * 50% - var(--size) / 2);transition:opacity .8s}
.stage.live .poster{opacity:0}
.poster.swap{opacity:0;transition:opacity .25s}
.glow{position:absolute;width:var(--size);height:var(--size);left:calc(50% + var(--px) * 50% - var(--size) / 2);top:calc(50% - var(--py) * 50% - var(--size) / 2);background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);opacity:.7;transition:background .8s}
.ld{position:absolute;left:50%;bottom:calc(46svh);transform:translateX(-50%);font-size:12px;color:var(--muted);background:#ffffff10;padding:4px 12px;border-radius:99px;white-space:nowrap;animation:pulse 1.4s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.4}}
.lbls{position:absolute;inset:0}
.lbl{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .3s;will-change:transform}
.lbl i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 45%,transparent)}
.lbl span{position:absolute;left:0;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap;color:#fff;background:#0b0c10d0;padding:2px 10px;border-radius:8px;border:1px solid #ffffff22}
.lbl::before{content:"";position:absolute;left:-.5px;width:1px;height:34px;background:linear-gradient(#fff8,#fff2)}
.lbl.up span{bottom:38px}.lbl.up::before{bottom:6px}
.lbl.down span{top:38px}.lbl.down::before{top:6px}
.scene{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.scene.tall{align-items:stretch}
.scene.tall .wrap{display:flex;align-items:flex-end}
.scene.tall .card{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom))}
.card{max-width:520px;padding:4px 0;text-shadow:0 2px 20px #08090b}
.card h1{font-size:clamp(40px,12vw,84px);font-weight:900;line-height:1.1;letter-spacing:-1px}
.card h2{font-size:clamp(30px,8.6vw,60px);font-weight:900;line-height:1.2;letter-spacing:-.5px}
.lead{color:#c9ced8;font-size:17px;margin-top:10px}
.price{font-size:18px;font-weight:700;margin-top:10px;min-height:1.8em}
.price small{color:var(--muted);font-weight:400;font-size:14px;display:block}
.cta{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.opt3d{margin-top:12px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;min-height:36px}
.big{font-size:clamp(56px,18vw,120px);font-weight:900;line-height:1;margin:6px 0 2px;letter-spacing:-2px;background:linear-gradient(180deg,#fff,#ffffff80);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.big small{font-size:.3em;letter-spacing:0;margin-right:6px}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;list-style:none}
.parts li{font-size:13px;padding:3px 10px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff14}

/* Colour picker */
.swatches{display:flex;gap:14px;margin-top:16px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid #ffffff30;padding:4px;transition:border-color .2s,transform .2s}
.sw i{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 -6px 12px #0004,inset 0 4px 8px #fff3}
.sw[aria-pressed=true]{border-color:#fff;transform:scale(1.08)}
.swName{margin-top:8px;font-weight:700;min-height:1.8em}

/* Plain sections */
.plain{position:relative;z-index:1;padding:88px 0;background:var(--bg)}
.plain h2{font-size:clamp(30px,8vw,52px);font-weight:900;line-height:1.25;margin-bottom:28px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px}
.spec b{display:block;font-size:30px;font-weight:900;line-height:1.3}
.spec span{display:block;color:var(--muted);font-size:14px}
.spec small{color:var(--muted);font-size:13px}
.box{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.box h3{font-size:18px;margin-bottom:8px}
.box ul{list-style:none;display:grid;gap:6px;color:#c9ced8}
.box li::before{content:"✓";color:var(--acc);margin-left:8px;font-weight:900}
.final{background:linear-gradient(160deg,var(--bg2),#0c0d12);border:1px solid var(--line);border-radius:28px;padding:44px 22px}
.final h2{margin-bottom:8px}
.final p{color:var(--muted);margin-bottom:22px}
.ftr{padding:28px 0 120px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line)}

/* Reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}

/* Sticky buy bar + toast */
.bar{position:fixed;inset:auto 0 0;z-index:40;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.bar.on{transform:none}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;background:rgba(20,22,28,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 8px}
.bar .dot{width:26px;height:26px;border-radius:50%;flex:none;margin-right:6px;border:2px solid #ffffff40;transition:background .5s}
.bar-t{flex:1;min-width:0;line-height:1.4}
.bar-t b{display:block;font-size:14px}
.bar-t span{font-size:13px;color:var(--muted)}
.bar .btn{min-height:44px;padding:8px 24px}
.toast{position:fixed;left:50%;bottom:96px;z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#fff;color:#08090b;font-weight:700;font-size:14px;padding:10px 18px;border-radius:14px;width:max-content;max-width:calc(100vw - 32px);text-align:center;transition:opacity .3s,transform .3s;box-shadow:0 10px 40px #0008}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Static (no-3D) mode: poster stays, swaps to exploded image inside #inside */
.static .lbls{display:none}

@media (min-width:820px){
  :root{--pad:32px;--hdr:68px}
  .nav{display:flex}
  .stage{--px:-.45;--py:.02;--s:.75}
  .scene{align-items:center;padding:0}
  .scene .wrap{display:flex;justify-content:flex-start}
  .scene.tall .wrap{align-items:center}
  .scene.tall .card{top:calc(50svh - 160px);bottom:auto}
  .card{width:44%;text-shadow:none}
  .specs{grid-template-columns:repeat(4,1fr)}
  .ftr{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}*{animation:none!important}}
</style>

<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<header class="hdr" id="hdr">
  <div class="wrap">
    <a href="#top" class="logo">آوانو</a>
    <nav class="nav"><a href="#design">طراحی</a><a href="#anc">حذف نویز</a><a href="#inside">از درون</a><a href="#colors">رنگ‌ها</a><a href="#specs">مشخصات</a></nav>
    <button class="btn btn-sm" data-buy>خرید</button>
  </div>
</header>

<main>
  <div class="story" id="story">
    <div class="stage" id="stage" aria-hidden="true">
      <div class="glow" id="glow"></div>
      <img class="poster" id="poster" src="img/hp-night.webp" alt="" width="600" height="600" fetchpriority="high" decoding="async" onload="document.documentElement.classList.add('f')" onerror="this.onload()">
      <div class="lbls" id="lbls" data-dbg-ok></div>
      <span class="ld" id="ld" hidden>در حال آماده‌سازی نمای سه‌بعدی…</span>
    </div>

    <section id="top" class="scene hero" data-scene="0">
      <div class="wrap"><div class="card">
        <span class="eyebrow">تازه رسید</span>
        <h1>آوانو سکوت</h1>
        <p class="lead">هدفون بی‌سیم با حذف نویز فعال. دنیا را خاموش کن، موسیقی را روشن.</p>
        <p class="price" id="heroPrice">&nbsp;</p>
        <div class="cta"><button class="btn" data-buy>خرید</button><a class="btn btn-line" href="#inside">از درون ببین</a></div>
        <button class="opt3d" id="opt3d" hidden></button>
      </div></div>
    </section>
    <!-- other story sections are rendered from data.js by app.js -->
  </div>

  <section id="specs" class="plain">
    <div class="wrap">
      <span class="eyebrow">مشخصات</span>
      <h2>همه‌ی عددها</h2>
      <div class="specs" id="specList"></div>
      <div class="box rv"><h3>در جعبه</h3><ul id="boxList"></ul></div>
    </div>
  </section>

  <section id="buy" class="plain center">
    <div class="wrap"><div class="final rv">
      <h2>آماده‌ی سکوت؟</h2>
      <p id="finalP"></p>
      <button class="btn" data-buy>خرید آوانو سکوت</button>
    </div></div>
  </section>
</main>

<footer class="ftr"><div class="wrap"><p>© ۱۴۰۵ آوانو — برند و محصول خیالی، نمونه‌ی نمایشی · طراحی توسط Dreeix</p></div></footer>

<div class="bar" id="bar">
  <div class="bar-in">
    <span class="dot" id="barDot"></span>
    <div class="bar-t"><b id="barName"></b><span id="barPrice"></span></div>
    <button class="btn" data-buy>خرید</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
